<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Among Trolls 🃏</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.box {
  background: white;
  padding: 20px;
  border-radius: 12px;
  width: 360px;
}
button { margin: 4px 0; width: 100%; }
.role-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.role-line button {
  width: 30px;
}
</style>
</head>

<body>
<div class="box">
<h2>Among Trolls 🃏</h2>
<div id="app"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCOcYbmpg8ULnLZavZFLDlERp3tlKOcdGY",
  authDomain: "amongtroll-4a3c5.firebaseapp.com",
  databaseURL: "https://amongtroll-4a3c5-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "amongtroll-4a3c5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let screen = "home";
let roomCode = "";
let name = "";
let players = [];
let roles = {};
let owner = "";

let roleConfig = {
  tryharder: 3,
  escroc: 1,
  imposteur: 1
};

function generateCode(){
  return Math.random().toString(36).substring(2,7).toUpperCase();
}

function assignRoles(list){
  let arr = [];
  arr.push(...Array(roleConfig.tryharder).fill("Try-Harder"));
  arr.push(...Array(roleConfig.escroc).fill("Escroc"));
  arr.push(...Array(roleConfig.imposteur).fill("Imposteur"));

  arr.sort(() => Math.random() - 0.5);

  let obj = {};
  list.forEach((p,i) => obj[p] = arr[i]);
  return obj;
}

function updateRole(type, delta){
  if(name !== owner) return;

  roleConfig[type] += delta;
  if(roleConfig[type] < 0) roleConfig[type] = 0;

  const total = roleConfig.tryharder + roleConfig.escroc + roleConfig.imposteur;
  if(total > players.length){
    roleConfig[type] -= delta;
    return;
  }

  db.ref("rooms/"+roomCode+"/roleConfig").set(roleConfig);
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  if(screen === "home"){
    app.innerHTML = `
      <input id="pseudo" placeholder="Pseudo">
      <button onclick="createRoom()">Créer</button>
      <input id="code" placeholder="Code">
      <button onclick="joinRoom()">Rejoindre</button>
    `;
  }

  if(screen === "lobby"){
    app.innerHTML = `
      <p>Code : <b>${roomCode}</b></p>
      <ul>${players.map(p=>`<li>${p}</li>`).join("")}</ul>

      ${name === owner ? `
        <h4>🎭 Rôles</h4>

        <div class="role-line">
          Try-Harder : ${roleConfig.tryharder}
          <button onclick="updateRole('tryharder',1)">+</button>
          <button onclick="updateRole('tryharder',-1)">−</button>
        </div>

        <div class="role-line">
          Escroc : ${roleConfig.escroc}
          <button onclick="updateRole('escroc',1)">+</button>
          <button onclick="updateRole('escroc',-1)">−</button>
        </div>

        <div class="role-line">
          Imposteur : ${roleConfig.imposteur}
          <button onclick="updateRole('imposteur',1)">+</button>
          <button onclick="updateRole('imposteur',-1)">−</button>
        </div>
      ` : `<p>Config par le créateur</p>`}

      ${players.length === (roleConfig.tryharder + roleConfig.escroc + roleConfig.imposteur)
        ? (name === owner ? `<button onclick="startGame()">Démarrer</button>` : `<p>En attente…</p>`)
        : `<p>⚠️ Total rôles ≠ joueurs</p>`
      }
    `;
  }

  if(screen === "role"){
    app.innerHTML = `
      <p>Ton rôle : <b>${roles[name]}</b></p>
      ${name === owner ? `<button onclick="restartGame()">Nouvelle partie</button>` : ""}
    `;
  }
}

function createRoom(){
  name = document.getElementById("pseudo").value.trim();
  roomCode = generateCode();
  players = [name];

  db.ref("rooms/"+roomCode).set({
    players,
    owner: name,
    started: false,
    roleConfig
  });

  listenRoom();
  screen = "lobby";
  render();
}

function joinRoom(){
  name = document.getElementById("pseudo").value.trim();
  roomCode = document.getElementById("code").value.trim().toUpperCase();

  db.ref("rooms/"+roomCode).get().then(snap=>{
    players = snap.val().players || [];
    if(!players.includes(name)) players.push(name);
    db.ref("rooms/"+roomCode+"/players").set(players);
    listenRoom();
    screen = "lobby";
  });
}

function listenRoom(){
  db.ref("rooms/"+roomCode).on("value", snap=>{
    const data = snap.val();
    players = data.players || [];
    roles = data.roles || {};
    owner = data.owner;
    roleConfig = data.roleConfig || roleConfig;
    screen = data.started ? "role" : "lobby";
    render();
  });
}

function startGame(){
  if(name !== owner) return;
  roles = assignRoles(players);
  db.ref("rooms/"+roomCode).update({ roles, started:true });
}

function restartGame(){
  if(name !== owner) return;
  db.ref("rooms/"+roomCode).update({ started:false, roles:{} });
}

render();
</script>
</body>
</html>
