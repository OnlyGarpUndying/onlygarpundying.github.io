<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Among Trolls 🃏</title>

<meta name="description" content="Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne.">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4250515135506041"
crossorigin="anonymous"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#f3f4f6,#d1d5db,#fbbf24);
  display:flex;justify-content:center;align-items:center;height:100vh;margin:0;
}
.box{
  background:white;padding:40px;border-radius:20px;width:600px;
  box-shadow:0 12px 28px rgba(0,0,0,.2)
}
input,button,select{
  width:100%;margin:6px 0;padding:10px;border-radius:10px;font-size:16px
}
button{background:#4f46e5;color:white;border:none;cursor:pointer}
button:hover{background:#6366f1}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ddd;padding:6px;text-align:center}
</style>
</head>

<body>
<div class="box">
<h2>Among Trolls 🃏</h2>
<div id="app"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCOcYbmpg8ULnLZavZFLDlERp3tlKOcdGY",
  databaseURL:"https://amongtroll-4a3c5-default-rtdb.europe-west1.firebasedatabase.app"
});
const db=firebase.database();

let screen="home",roomCode="",name="",players=[],roles={},owner="",votes={};
let maxPlayers=5;
let roleCounts={Imposteur:1,Escroc:1,"Try-Harder":3};

function saveAccount(pseudo){
  localStorage.setItem("account",JSON.stringify({pseudo}));
}
function loadAccount(){
  const d=localStorage.getItem("account");
  return d?JSON.parse(d):null;
}

function generateCode(){
  return Math.random().toString(36).substring(2,7).toUpperCase();
}
function adjustTryHarder(){
  roleCounts["Try-Harder"]=maxPlayers-(roleCounts.Imposteur+roleCounts.Escroc);
}
function assignRoles(list){
  let all=[];
  for(let r in roleCounts)
    for(let i=0;i<roleCounts[r];i++) all.push(r);
  all.sort(()=>Math.random()-0.5);
  let obj={};
  list.forEach((p,i)=>obj[p]=all[i]);
  return obj;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";

  if(screen==="home"){
    const acc=loadAccount();
    app.innerHTML=`
      <input id="pseudo" placeholder="Pseudo" value="${acc?acc.pseudo:""}">
      <button onclick="savePseudo()">Sauvegarder</button>
      <hr>
      <label>Joueurs max :</label>
      <input type="number" min="2" max="10" value="${maxPlayers}"
      onchange="maxPlayers=parseInt(this.value);adjustTryHarder();render()">
      <label>Imposteur :</label>
      <input type="number" value="${roleCounts.Imposteur}"
      onchange="roleCounts.Imposteur=parseInt(this.value);adjustTryHarder();render()">
      <label>Escroc :</label>
      <input type="number" value="${roleCounts.Escroc}"
      onchange="roleCounts.Escroc=parseInt(this.value);adjustTryHarder();render()">
      <label>Try-Harder :</label>
      <input value="${roleCounts["Try-Harder"]}" disabled>
      <button onclick="createRoom()">Créer salon</button>
      <input id="code" placeholder="Code salon">
      <button onclick="joinRoom()">Rejoindre</button>
    `;
  }

  if(screen==="lobby"){
    app.innerHTML=`
      <p>Code : <b>${roomCode}</b></p>
      <ul>${players.map(p=>`<li>${p}</li>`).join("")}</ul>
      ${name===owner && players.length===maxPlayers
        ?`<button onclick="startGame()">Démarrer</button>`
        :"⏳ En attente"}
    `;
  }

  if(screen==="role"){
    app.innerHTML=`
      <h3>Ton rôle : ${roles[name]}</h3>
      <button onclick="startVote()">Voter</button>
    `;
  }

  if(screen==="vote"){
    app.innerHTML=`<h3>Vote</h3>`;
    players.filter(p=>p!==name).forEach(p=>{
      app.innerHTML+=`
        <label>${p}</label>
        <select id="v_${p}">
          <option value="">Choisir</option>
          <option>Imposteur</option>
          <option>Escroc</option>
          <option>Try-Harder</option>
        </select>
      `;
    });
    app.innerHTML+=`<button onclick="submitVote()">Valider</button>`;
  }

  if(screen==="results"){
    app.innerHTML="<h3>Résultats</h3><table><tr><th>Joueur</th><th>Rôle</th><th>Votes reçus</th></tr>";
    players.forEach(p=>{
      let received=[];
      for(let v in votes){
        if(votes[v].target===p) received.push(v+" → "+votes[v].role);
      }
      app.innerHTML+=`<tr><td>${p}</td><td>${roles[p]}</td><td>${received.join("<br>")}</td></tr>`;
    });
    app.innerHTML+="</table>";
    if(name===owner) app.innerHTML+=`<button onclick="restart()">Nouvelle partie</button>`;
  }
}

function savePseudo(){
  const p=document.getElementById("pseudo").value.trim();
  if(!p) return alert("Pseudo requis");
  saveAccount(p); name=p; render();
}

function createRoom(){
  if(!name) return alert("Pseudo requis");
  roomCode=generateCode();
  players=[name]; owner=name;
  db.ref("rooms/"+roomCode).set({players,owner,started:false,maxPlayers,roleCounts});
  listen(); screen="lobby"; render();
}

function joinRoom(){
  const p=document.getElementById("pseudo").value.trim();
  if(!p) return alert("Pseudo requis");
  name=p;
  roomCode=document.getElementById("code").value.trim().toUpperCase();
  db.ref("rooms/"+roomCode).get().then(s=>{
    if(!s.exists()) return alert("Introuvable");
    let d=s.val();
    if(d.players.length>=d.maxPlayers) return alert("Complet");
    if(!d.players.includes(name)) d.players.push(name);
    db.ref("rooms/"+roomCode+"/players").set(d.players);
    listen(); screen="lobby"; render();
  });
}

function listen(){
  db.ref("rooms/"+roomCode).on("value",s=>{
    if(!s.exists()) return;
    const d=s.val();
    players=d.players; roles=d.roles||{}; votes=d.votes||{};
    owner=d.owner; maxPlayers=d.maxPlayers; roleCounts=d.roleCounts;
    screen=d.phase||screen;
    render();
  });
}

function startGame(){
  roles=assignRoles(players);
  db.ref("rooms/"+roomCode).update({roles,phase:"role"});
}

function startVote(){
  db.ref("rooms/"+roomCode).update({phase:"vote",votes:{}});
}

function submitVote(){
  players.filter(p=>p!==name).forEach(p=>{
    const r=document.getElementById("v_"+p).value;
    if(r) db.ref("rooms/"+roomCode+"/votes/"+name).set({target:p,role:r});
  });
  db.ref("rooms/"+roomCode).once("value",s=>{
    if(Object.keys(s.val().votes||{}).length===players.length)
      db.ref("rooms/"+roomCode).update({phase:"results"});
  });
}

function restart(){
  db.ref("rooms/"+roomCode).update({phase:"home",roles:{},votes:{}});
  screen="home"; render();
}

const acc=loadAccount();
if(acc) name=acc.pseudo;
render();
</script>
</body>
</html>
