<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Among Trolls 🃏</title>

<meta name="description" content="Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne.">
<meta name="robots" content="index, follow">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4250515135506041"
 crossorigin="anonymous"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#f3f4f6,#d1d5db,#fbbf24);
  display:flex;justify-content:center;align-items:center;
  height:100vh;margin:0;
}
.box{
  background:white;padding:50px;border-radius:20px;
  width:600px;box-shadow:0 12px 28px rgba(0,0,0,.2)
}
input,button{
  width:100%;padding:10px;margin:6px 0;
  border-radius:10px;font-size:16px
}
button{
  background:#4f46e5;color:white;border:none;cursor:pointer
}
button:hover{background:#6366f1}
.menu{display:flex;gap:5px}
.menu button{font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ccc;padding:6px;text-align:center}
</style>
</head>

<body>
<div class="box">
<h2>Among Trolls 🃏</h2>
<div id="app"></div>
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyCOcYbmpg8ULnLZavZFLDlERp3tlKOcdGY",
 authDomain:"amongtroll-4a3c5.firebaseapp.com",
 databaseURL:"https://amongtroll-4a3c5-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"amongtroll-4a3c5"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let screen="home",roomCode="",name="",owner="";
let players=[],roles={},votes={},maxPlayers=5;
let roleCounts={Imposteur:1,Escroc:1,"Try-Harder":3};

/* -------- Compte local -------- */
function saveAccount(pseudo){
 localStorage.setItem("account",JSON.stringify({pseudo}));
}
function loadAccount(){
 const a=localStorage.getItem("account");
 return a?JSON.parse(a):null;
}

/* -------- Utils -------- */
function generateCode(){
 return Math.random().toString(36).substring(2,7).toUpperCase();
}
function adjustTryHarder(){
 roleCounts["Try-Harder"]=maxPlayers-(roleCounts.Imposteur+roleCounts.Escroc);
 if(roleCounts["Try-Harder"]<0) roleCounts["Try-Harder"]=0;
}
function assignRoles(){
 let arr=[];
 for(let r in roleCounts)
  for(let i=0;i<roleCounts[r];i++) arr.push(r);
 arr.sort(()=>Math.random()-0.5);
 let obj={};
 players.forEach((p,i)=>obj[p]=arr[i]);
 return obj;
}

/* -------- Render -------- */
function render(){
 const app=document.getElementById("app");
 const account=loadAccount();
 app.innerHTML=`
 <div class="menu">
  <button onclick="screen='home';render()">Accueil</button>
  <button onclick="screen='rules';render()">Règles</button>
  <button onclick="screen='about';render()">À propos</button>
 </div><hr>`;

 if(screen==="home"){
 adjustTryHarder();
 app.innerHTML+=`
 <h3>Compte</h3>
 <input id="pseudo" placeholder="Pseudo" value="${account?account.pseudo:""}">
 <button onclick="savePseudo()">Sauvegarder</button>

 <h3>Salon</h3>
 <label>Joueurs (2–10)</label>
 <input type="number" min="2" max="10" value="${maxPlayers}"
  onchange="maxPlayers=parseInt(this.value);adjustTryHarder();render()">

 <label>Imposteur</label>
 <input type="number" value="${roleCounts.Imposteur}"
  onchange="roleCounts.Imposteur=parseInt(this.value);adjustTryHarder();render()">

 <label>Escroc</label>
 <input type="number" value="${roleCounts.Escroc}"
  onchange="roleCounts.Escroc=parseInt(this.value);adjustTryHarder();render()">

 <label>Try-Harder</label>
 <input disabled value="${roleCounts["Try-Harder"]}">

 <button onclick="createRoom()">Créer un salon</button>
 <input id="code" placeholder="Code salon">
 <button onclick="joinRoom()">Rejoindre</button>`;
 }

 if(screen==="lobby"){
 app.innerHTML+=`
 <p>Code : <b>${roomCode}</b></p>
 <ul>${players.map(p=>`<li>${p}</li>`).join("")}</ul>
 <p>${players.length}/${maxPlayers}</p>`;
 if(name===owner && players.length===maxPlayers)
  app.innerHTML+=`<button onclick="startGame()">Démarrer</button>`;
 }

 if(screen==="role"){
 app.innerHTML+=`<h3>Ton rôle : ${roles[name]}</h3>
 <button onclick="startVote()">Voter</button>`;
 }

 if(screen==="vote"){
 app.innerHTML+=`<h3>Vote</h3>`;
 players.forEach(p=>{
  if(p!==name){
   app.innerHTML+=`
   <label>${p}
    <select id="v_${p}">
     <option></option>
     <option>Imposteur</option>
     <option>Escroc</option>
     <option>Try-Harder</option>
    </select>
   </label>`;
  }
 });
 app.innerHTML+=`<button onclick="submitVote()">Valider</button>`;
 }

 if(screen==="results"){
 app.innerHTML+=`
 <h3>Récapitulatif</h3>
 <table>
 <tr><th>Joueur</th><th>Rôle</th><th>Votes reçus</th></tr>
 ${players.map(p=>{
  let v=Object.entries(votes)
   .filter(([_,o])=>o[p])
   .map(([k,o])=>`${k}→${o[p]}`).join("<br>");
  return `<tr><td>${p}</td><td>${roles[p]}</td><td>${v||"-"}</td></tr>`;
 }).join("")}
 </table>`;
 if(name===owner)
  app.innerHTML+=`<button onclick="restart()">Nouvelle partie</button>`;
 }

 if(screen==="rules")
  app.innerHTML+=`<p>Imposteur : perdre discrètement<br>
  Escroc : se faire passer pour l'imposteur<br>
  Try-Harder : gagner</p>`;

 if(screen==="about")
  app.innerHTML+=`<p>Jeu multijoueur gratuit.</p>`;
}

/* -------- Actions -------- */
function savePseudo(){
 const p=document.getElementById("pseudo").value.trim();
 if(!p) return alert("Pseudo requis");
 saveAccount(p); name=p; render();
}

function createRoom(){
 if(!name) return alert("Pseudo requis");
 roomCode=generateCode();
 players=[name]; owner=name;
 db.ref("rooms/"+roomCode).set({
  players,owner,started:false,
  maxPlayers,roleCounts,votes:{}
 });
 listenRoom(); screen="lobby"; render();
}

function joinRoom(){
 if(!name) return alert("Pseudo requis");
 roomCode=document.getElementById("code").value.trim().toUpperCase();
 db.ref("rooms/"+roomCode).get().then(s=>{
  if(!s.exists()) return alert("Introuvable");
  let d=s.val();
  if(d.players.length>=d.maxPlayers) return alert("Complet");
  if(!d.players.includes(name)) d.players.push(name);
  db.ref("rooms/"+roomCode+"/players").set(d.players);
  listenRoom(); screen="lobby"; render();
 });
}

function listenRoom(){
 db.ref("rooms/"+roomCode).on("value",s=>{
  if(!s.exists()) return;
  let d=s.val();
  players=d.players||[];
  roles=d.roles||{};
  votes=d.votes||{};
  owner=d.owner;
  maxPlayers=d.maxPlayers;
  roleCounts=d.roleCounts;
  screen=d.started?"role":"lobby";
  render();
 });
}

function startGame(){
 roles=assignRoles();
 db.ref("rooms/"+roomCode).update({roles,started:true});
}

function startVote(){
 screen="vote"; render();
}

function submitVote(){
 let v={};
 players.forEach(p=>{
  if(p!==name){
   v[p]=document.getElementById("v_"+p).value;
  }
 });
 db.ref("rooms/"+roomCode+"/votes/"+name).set(v);
 screen="results"; render();
}

function restart(){
 db.ref("rooms/"+roomCode).update({started:false,roles:{},votes:{}});
 screen="home"; render();
}

const acc=loadAccount();
if(acc) name=acc.pseudo;
render();
</script>
</body>
</html>
