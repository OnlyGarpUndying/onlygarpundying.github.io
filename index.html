<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Among Trolls 🃏</title>
<meta name="description" content="Among Trolls est un mode de jeu multijoueur de rôle caché, jouable gratuitement en ligne associer à n'importe quel jeu d'équipe.">
<meta name="robots" content="index, follow">
<meta name="author" content="Among Trolls">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4250515135506041" crossorigin="anonymous"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #f3f4f6, #d1d5db, #fbbf24); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; transition: background 1s; }
.page { width: 100%; display: flex; justify-content: center; }
.box { background: white; padding: 60px; border-radius: 20px; width: 600px; z-index: 2; box-shadow: 0 12px 28px rgba(0,0,0,0.2); }
input, button { width: 100%; margin: 6px 0; padding: 10px; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
input[type=number] { font-size: 16px; padding: 8px 12px; text-align: center; height: 40px; -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: inner-spin-button; width: 48px; height: 48px; }
button { border: none; cursor: pointer; background-color: #4f46e5; color: white; transition: 0.3s; }
button:hover { background-color: #6366f1; transform: scale(1.05); }
.menu { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.9); padding: 6px; border-radius: 12px; }
.menu button { width: 100%; font-size: 12px; }
hr { margin: 10px 0; }
.side-ad { width: 160px; position: fixed; top: 50%; transform: translateY(-50%); }
.left-ad { left: 10px; }
.right-ad { right: 10px; }
@media (max-width: 900px) { .side-ad { display: none; } }
.role-popup { animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(0); opacity:0; } 100% { transform: scale(1); opacity:1; } }
.disabled { background-color: #a1a1aa !important; cursor: not-allowed !important; }
</style>
</head>
<body>
<div class="page">
  <div class="side-ad left-ad">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4250515135506041" data-ad-slot="1111111111" data-ad-format="vertical"></ins>
  </div>

  <div class="box">
    <h2>Among Trolls 🃏</h2>
    <div id="app"></div>
  </div>

  <div class="side-ad right-ad">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4250515135506041" data-ad-slot="2222222222" data-ad-format="vertical"></ins>
  </div>
</div>

<script>
(adsbygoogle = window.adsbygoogle || []).push({});
(adsbygoogle = window.adsbygoogle || []).push({});
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCOcYbmpg8ULnLZavZFLDlERp3tlKOcdGY",
  authDomain: "amongtroll-4a3c5.firebaseapp.com",
  databaseURL: "https://amongtroll-4a3c5-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "amongtroll-4a3c5",
  storageBucket: "amongtroll-4a3c5.appspot.com",
  messagingSenderId: "245950843484",
  appId: "1:245950843484:web:b4f808a0fcbf19d3e67499"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let screen="home", roomCode="", name="", players=[], roles={}, owner="", votes={}, votedPlayers=[];
let maxPlayers=5;
let roleCounts={Imposteur:1, Escroc:1, "Try-Harder":3};

/* ================= LANGUE ================= */
let lang = localStorage.getItem("lang") || "fr";

const i18n = {
  fr: {
    home:"Accueil", rules:"Règles", about:"À propos", description:"Description",
    localAccount:"Compte local", pseudo:"Ton pseudo", savePseudo:"Sauvegarder le pseudo",
    createJoin:"Créer ou rejoindre un salon",
    players:"Nombre de joueurs (2 à 10)",
    roles:"Rôles",
    createRoom:"Créer un salon", join:"Rejoindre",
    roomCode:"Code du salon",
    waiting:"⏳ En attente joueurs / rôles",
    waitingOwner:"⏳ En attente du créateur de salon",
    start:"Démarrer la partie",
    finishVote:"Finis de voter",
    results:"Résultat",
    finalResults:"Résultats finaux",
    descriptionText:"Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne.",
    rulesText:"Try-Harder : doit gagner la partie.<br>Imposteur : doit perdre la partie sans se faire repérer.<br>Escroc : doit se faire passer pour l'imposteur et gagner.",
    aboutText:"Mini-jeu multijoueur gratuit",
    pseudoRequired:"Pseudo requis",
    roomNotFound:"Salon introuvable",
    roomFull:"Salon complet",
    roleOptions: { "Imposteur":"Imposteur", "Escroc":"Escroc", "Try-Harder":"Try-Harder" }
  },
  en: {
    home:"Home", rules:"Rules", about:"About", description:"Description",
    localAccount:"Local account", pseudo:"Your nickname", savePseudo:"Save nickname",
    createJoin:"Create or join a room",
    players:"Number of players (2 to 10)",
    roles:"Roles",
    createRoom:"Create room", join:"Join",
    roomCode:"Room code",
    waiting:"⏳ Waiting for players / roles",
    waitingOwner:"⏳ Waiting for host",
    start:"Start game",
    finishVote:"Finish voting",
    results:"Results",
    finalResults:"Final results",
    descriptionText:"Among Trolls is a free online multiplayer hidden-role game.",
    rulesText:"Try-Harder: must win the game.<br>Impostor: must lose without being detected.<br>Swindler: pretends to be the impostor and wins.",
    aboutText:"Free multiplayer mini-game",
    pseudoRequired:"Nickname required",
    roomNotFound:"Room not found",
    roomFull:"Room is full",
    roleOptions: { "Imposteur":"Impostor", "Escroc":"Swindler", "Try-Harder":"Try-Harder" }
  }
};

function t(key){ return i18n[lang][key] || key; }

/* ================= BOUTON LANGUE ================= */
const langBtn = document.createElement("button");
langBtn.id = "langBtn";
langBtn.style = "position:fixed;top:12px;right:12px;z-index:999;padding:8px 14px;border-radius:12px;border:none;font-weight:bold;cursor:pointer;background:#111827;color:white;font-size:18px;";
langBtn.onclick = toggleLang;
document.body.appendChild(langBtn);

function updateLangButton() {
  if(lang==="fr"){ 
    langBtn.innerHTML = "🇫🇷"; 
  } else { 
    langBtn.innerHTML = "🇬🇧"; 
  }
}

function toggleLang(){
  lang = (lang==="fr")?"en":"fr";
  localStorage.setItem("lang",lang);
  updateLangButton();
  render();
}

updateLangButton();

/* ================= FONCTIONS JEU ================= */
function saveAccount(pseudo){ localStorage.setItem("account", JSON.stringify({pseudo})); }
function loadAccount(){ const data=localStorage.getItem("account"); return data ? JSON.parse(data) : null; }
function generateCode(){ return Math.random().toString(36).substring(2,7).toUpperCase(); }
function assignRoles(list){ 
  let allRoles=[]; 
  for(let r in roleCounts) for(let i=0;i<roleCounts[r];i++) allRoles.push(r); 
  allRoles.sort(()=>Math.random()-0.5); 
  let obj={}; list.forEach((p,i)=>obj[p]=allRoles[i]); 
  return obj; 
}
function adjustTryHarder(){ roleCounts["Try-Harder"]=maxPlayers-(roleCounts.Imposteur+roleCounts.Escroc); if(roleCounts["Try-Harder"]<0) roleCounts["Try-Harder"]=0; }

function savePseudoFromInput(){ 
  const pseudo=document.getElementById("pseudo").value.trim(); 
  if(!pseudo) return alert(t("pseudoRequired")); 
  saveAccount(pseudo); 
  name=pseudo; 
  render(); 
}

function createRoom(){
  name=document.getElementById("pseudo").value.trim(); 
  if(!name) return alert(t("pseudoRequired"));
  maxPlayers=parseInt(document.getElementById("maxPlayersInput").value); adjustTryHarder();
  if(maxPlayers<2||maxPlayers>10) return alert(t("players"));
  if(roleCounts.Imposteur+roleCounts.Escroc+roleCounts["Try-Harder"]!==maxPlayers) return alert(t("roles"));
  roomCode=generateCode(); players=[name]; owner=name;
  db.ref("rooms/"+roomCode).set({players,owner,started:false,maxPlayers,roleCounts,votes:{},votedPlayers:[]});
  listenRoom(); screen="lobby"; render();
}

function joinRoom(){
  name=document.getElementById("pseudo").value.trim(); 
  roomCode=document.getElementById("code").value.trim().toUpperCase();
  if(!name) return alert(t("pseudoRequired"));
  db.ref("rooms/"+roomCode).get().then(snap=>{
    if(!snap.exists()) return alert(t("roomNotFound"));
    const data=snap.val(); 
    players=data.players||[]; owner=data.owner||""; 
    maxPlayers=data.maxPlayers||maxPlayers; 
    roleCounts=data.roleCounts||roleCounts;
    votes=data.votes||{};
    votedPlayers=data.votedPlayers||[];
    if(players.length>=maxPlayers) return alert(t("roomFull"));
    if(!players.includes(name)) players.push(name); 
    db.ref("rooms/"+roomCode+"/players").set(players);
    listenRoom(); screen="lobby"; render();
  });
}

function startGame(){ 
  if(name!==owner) return; 
  roles=assignRoles(players); 
  db.ref("rooms/"+roomCode).update({roles,started:true,votes:{},votedPlayers:[]}); 
}
function restartGame(){ 
  if(name!==owner) return; 
  roles=assignRoles(players); 
  db.ref("rooms/"+roomCode).update({roles,started:true,votes:{},votedPlayers:[]}); 
  screen="role"; render();
}

function submitVoteLive(){
  const voteObj = {};
  players.forEach(p => { if(p!==name){ voteObj[p] = document.getElementById("vote_"+p).value || t("finishVote"); } });
  db.ref(`rooms/${roomCode}/votes/${name}`).set(voteObj);
  db.ref(`rooms/${roomCode}/votedPlayers`).transaction(vp => { if(!vp) vp=[]; if(!vp.includes(name)) vp.push(name); return vp; });
}

function renderRoleScreen(){
  const app = document.getElementById("app");
  app.innerHTML = `<p class="role-popup">${t("roles")} : <b>${roles[name]}</b></p><h3>${t("finishVote")}</h3>`;
  players.forEach(p => {
    if(p!==name){
      const currentVote = votes[name] && votes[name][p] ? votes[name][p] : "";
      app.innerHTML += `
        <label>${p} :
          <select id="vote_${p}">
            <option value="">--${t("finishVote")}--</option>
            <option value="Imposteur" ${currentVote==="Imposteur"?"selected":""}>${i18n[lang].roleOptions["Imposteur"]}</option>
            <option value="Escroc" ${currentVote==="Escroc"?"selected":""}>${i18n[lang].roleOptions["Escroc"]}</option>
            <option value="Try-Harder" ${currentVote==="Try-Harder"?"selected":""}>${i18n[lang].roleOptions["Try-Harder"]}</option>
          </select>
        </label>
      `;
    }
  });
  const hasVoted = votedPlayers.includes(name);
  app.innerHTML += `<button ${hasVoted?"disabled class='disabled'":""} onclick="submitVoteLive()">${t("finishVote")}</button>`;
  if(votedPlayers.length === players.length){
    app.innerHTML += `<button onclick="showResults()">${t("results")}</button>`;
  }
}

function listenRoom(){
  db.ref("rooms/"+roomCode).on("value", snap => {
    if(!snap.exists()) return;
    const data = snap.val();
    players = data.players || [];
    roles = data.roles || {};
    owner = data.owner || "";
    maxPlayers = data.maxPlayers || maxPlayers;
    roleCounts = data.roleCounts || roleCounts;
    votes = data.votes || {};
    votedPlayers = data.votedPlayers || [];
    screen = data.started ? "role" : "lobby";
    if(screen === "role"){ renderRoleScreen(); } else { render(); }
  });
}

function showResults(){ screen="results"; render(); }

function render(){
  const app=document.getElementById("app");
  const account = loadAccount();
  const savedPseudo = account ? account.pseudo : "";
  app.innerHTML=`
    <div class="menu">
      <button onclick="screen='home'; render()">${t("home")}</button>
      <button onclick="screen='rules'; render()">${t("rules")}</button>
      <button onclick="screen='about'; render()">${t("about")}</button>
      <button onclick="screen='description'; render()">${t("description")}</button>
    </div><hr>
  `;

  if(screen==="home"){
    adjustTryHarder();
    app.innerHTML+=`
      <h3>${t("localAccount")}</h3>
      <input id="pseudo" placeholder="${t("pseudo")}" value="${savedPseudo}">
      <button onclick="savePseudoFromInput()">${t("savePseudo")}</button>
      <hr>
      <h4>${t("createJoin")}</h4>
      <label>${t("players")} :</label>
      <input id="maxPlayersInput" type="number" min="2" max="10" value="${maxPlayers}" onchange="maxPlayers=parseInt(this.value); adjustTryHarder(); render()">
      <h4>${t("roles")} :</h4>
      <label>Imposteur : <input id="nbImposteur" type="number" min="0" max="10" value="${roleCounts.Imposteur}" onchange="roleCounts.Imposteur=parseInt(this.value); adjustTryHarder(); render()"></label>
      <label>Escroc : <input id="nbEscroc" type="number" min="0" max="10" value="${roleCounts.Escroc}" onchange="roleCounts.Escroc=parseInt(this.value); adjustTryHarder(); render()"></label>
      <label>Try-Harder : <input type="number" value="${roleCounts['Try-Harder']}" disabled></label>
      <button onclick="createRoom()">${t("createRoom")}</button>
      <input id="code" placeholder="${t("roomCode")}">
      <button onclick="joinRoom()">${t("join")}</button>
    `;
  }

  if(screen==="description"){ app.innerHTML+=`<h3>📝 ${t("description")}</h3><p>${t("descriptionText")}</p>`; }
  if(screen==="rules"){ app.innerHTML+=`<h3>📜 ${t("rules")}</h3><p>${t("rulesText")}</p>`; }
  if(screen==="about"){ app.innerHTML+=`<h3>ℹ️ ${t("about")}</h3><p>${t("aboutText")}</p>`; }

  if(screen==="lobby"){
    app.innerHTML+=`<p>${t("roomCode")} : <b>${roomCode}</b></p><ul>${players.map(p=>`<li>${p}</li>`).join("")}</ul><p>(${players.length}/${maxPlayers})</p>`;
    if(players.length === maxPlayers){
      if(name===owner){
        app.innerHTML+=`<button onclick="startGame()">${t("start")}</button>`;
      } else {
        app.innerHTML+=`<p>${t("waitingOwner")}</p>`;
      }
    } else {
      app.innerHTML+=`<p>${t("waiting")}</p>`;
    }
  }

  if(screen==="results"){
    app.innerHTML+=`<h3>${t("finalResults")}</h3>`;
    app.innerHTML+=`
      <table style="width:100%;border-collapse: collapse;font-family: Arial, sans-serif;text-align:center;margin-top:10px;">
        <thead>
          <tr style="background:#4f46e5;color:white;">
            <th style="border:1px solid #000;padding:8px;">${t("pseudo")}</th>
            ${players.map(p=>`<th style="border:1px solid #000;padding:8px;">${p}<br>(${i18n[lang].roleOptions[roles[p]]})</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${players.map((p,i)=>`<tr style="background:${i%2===0?'#f9f9f9':'#ffffff'};">
            <td style="border:1px solid #000;padding:8px;">${p}</td>
            ${players.map(target => {
              if(p===target){ return `<td style="border:1px solid #000;padding:8px;">--</td>`; }
              else { const voteValue = votes[p] && votes[p][target] ? i18n[lang].roleOptions[votes[p][target]] : ""; return `<td style="border:1px solid #000;padding:8px;">${voteValue}</td>`; }
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    `;
    if(name===owner){ app.innerHTML+=`<button style="margin-top:10px;" onclick="restartGame()">Nouvelle partie</button>`; }
  }
}

// Auto-load pseudo
const account = loadAccount();
if(account) name = account.pseudo;
render();
</script>
</body>
</html>
