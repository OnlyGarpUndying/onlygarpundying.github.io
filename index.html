<body>
<div class="page">
  <div class="side-ad left-ad">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4250515135506041" data-ad-slot="1111111111" data-ad-format="vertical"></ins>

    <h2>Among Trolls 🃏</h2>
    <div id="app"></div>
  </div>

  <div class="side-ad right-ad">

  </div>

<script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCOcYbmpg8ULnLZavZFLDlERp3tlKOcdGY",
  authDomain: "amongtroll-4a3c5.firebaseapp.com",
  databaseURL: "https://amongtroll-4a3c5-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "amongtroll-4a3c5",
  storageBucket: "amongtroll-4a3c5.appspot.com",
  messagingSenderId: "245950843484",
  appId: "1:245950843484:web:b4f808a0fcbf19d3e67499"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let screen="home", roomCode="", name="", players=[], roles={}, owner="", votes={}, votedPlayers=[];

// ------------------- Compte local -------------------
function saveAccount(pseudo) {
  localStorage.setItem("account", JSON.stringify({ pseudo }));
}
function loadAccount() {
  const data = localStorage.getItem("account");
  if(!data) return null;
  return JSON.parse(data);
}

// ------------------- Roles et salon -------------------
let maxPlayers=5;
let roleCounts={Imposteur:1, Escroc:1, "Try-Harder":3};

function generateCode(){return Math.random().toString(36).substring(2,7).toUpperCase();}
function assignRoles(list){
  let allRoles=[];
  for(let r in roleCounts) for(let i=0;i<roleCounts[r];i++) allRoles.push(r);
  allRoles.sort(()=>Math.random()-0.5);
  let obj={};
  list.forEach((p,i)=>obj[p]=allRoles[i]);
  return obj;
}
function adjustTryHarder(){
  roleCounts["Try-Harder"]=maxPlayers-(roleCounts.Imposteur+roleCounts.Escroc);
  if(roleCounts["Try-Harder"]<0) roleCounts["Try-Harder"]=0;
}

// ---------------- RENDER ----------------
function render(){
const app=document.getElementById("app");
app.innerHTML="";

if(screen==="home"){
app.innerHTML=`
<input id="pseudo" placeholder="Pseudo">
<input id="code" placeholder="Code salon">
<button onclick="createRoom()">Créer salon</button>
<button onclick="joinRoom()">Rejoindre</button>`;
}

if(screen==="lobby"){
app.innerHTML=`
<p>Code : <b>${roomCode}</b></p>
<ul>${players.map(p=>`<li>${p}</li>`).join("")}</ul>
${name===owner?`<button onclick="startGame()">Démarrer</button>`:""}
`;
}

if(screen==="role"){
app.innerHTML=`<p>Ton rôle : <b>${roles[name]}</b></p>`;
players.forEach(p=>{
if(p!==name){
app.innerHTML+=`
<label>${p}
<select id="vote_${p}">
<option value="">--</option>
<option>Imposteur</option>
<option>Escroc</option>
<option>Try-Harder</option>
</select></label>`;
}
});
app.innerHTML+=`
<button ${votedPlayers.includes(name)?"class='disabled' disabled":""} onclick="submitVote()">Finis de voter</button>
${name===owner && votedPlayers.length===players.length?
`<button onclick="showResults()">Résultat</button>`:""}
`;
}

if(screen==="results"){
app.innerHTML="<h3>Résultats</h3><table><tr><th>Joueur</th>";
players.forEach(p=>app.innerHTML+=`<th>${p}<br>(${roles[p]})</th>`);
app.innerHTML+="</tr>";

players.forEach(p=>{
app.innerHTML+=`<tr><td>${p}</td>`;
players.forEach(t=>{
if(p===t) app.innerHTML+="<td>--</td>";
else app.innerHTML+=`<td>${votes[p]?.[t]||""}</td>`;
});
app.innerHTML+="</tr>";
});
app.innerHTML+="</table>";
}
}

// ---------------- SALON ----------------
function createRoom(){
name=document.getElementById("pseudo").value.trim();
if(!name)return alert("Pseudo requis");
roomCode=Math.random().toString(36).substring(2,7).toUpperCase();
players=[name]; owner=name;
db.ref("rooms/"+roomCode).set({
players,owner,started:false,
votes:{},votedPlayers:[],showResults:false
});
listenRoom(); screen="lobby"; render();
}

function joinRoom(){
name=document.getElementById("pseudo").value.trim();
roomCode=document.getElementById("code").value.trim().toUpperCase();
if(!name)return alert("Pseudo requis");

db.ref("rooms/"+roomCode).get().then(s=>{
if(!s.exists())return alert("Salon introuvable");
players=s.val().players||[];
players.push(name);
db.ref("rooms/"+roomCode+"/players").set(players);
listenRoom(); screen="lobby"; render();
});
}

function listenRoom(){
db.ref("rooms/"+roomCode).on("value",snap=>{
if(!snap.exists())return;
const d=snap.val();
players=d.players||[];
roles=d.roles||{};
votes=d.votes||{};
votedPlayers=d.votedPlayers||[];
showResults=d.showResults||false;

if(showResults) screen="results";
else screen=d.started?"role":"lobby";

render();
});
}

// ---------------- GAME ----------------
function startGame(){
roles={};
players.forEach(p=>{
roles[p]=["Imposteur","Escroc","Try-Harder"][Math.floor(Math.random()*3)];
});
db.ref("rooms/"+roomCode).update({
started:true,
roles,
votes:{},
votedPlayers:[],
showResults:false
});
}

// ---------------- VOTE ----------------
function submitVote(){
let v={};
players.forEach(p=>{
if(p!==name)v[p]=document.getElementById("vote_"+p).value||"";
});
db.ref("rooms/"+roomCode+"/votes/"+name).set(v);

db.ref("rooms/"+roomCode+"/votedPlayers").once("value").then(s=>{
let vp=s.val()||[];
if(!vp.includes(name))vp.push(name);
db.ref("rooms/"+roomCode+"/votedPlayers").set(vp);
});
}

// ⭐ RÉSULTATS POUR TOUS
function showResults(){
db.ref("rooms/"+roomCode).update({ showResults:true });
}

render();
</script>
</body>
</html>
