<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Among Trolls 🃏</title>

  <meta name="description" content="Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne.">
  <meta name="robots" content="index, follow">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #d1d5db, #fbbf24);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background 1s;
    }

    .page {
      width: 100%;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .box {
      background: white;
      padding: 60px;
      border-radius: 20px;
      width: 600px;
      z-index: 2;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      position: relative;
    }

    input,
    button {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input[type=number] {
      font-size: 16px;
      padding: 8px 12px;
      text-align: center;
      height: 40px;
      -moz-appearance: textfield;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: inner-spin-button;
      width: 48px;
      height: 48px;
    }

    button {
      border: none;
      cursor: pointer;
      background-color: #4f46e5;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background-color: #6366f1;
      transform: scale(1.05);
    }

    .menu {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      background: rgba(255,255,255,0.9);
      padding: 6px;
      border-radius: 12px;
    }

    .menu button {
      width: 100%;
      font-size: 12px;
    }

    .lang-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }

    .lang-buttons img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid #ddd;
    }

    hr {
      margin: 10px 0;
    }

    .role-popup {
      animation: pop 0.5s ease-out;
    }

    @keyframes pop {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .disabled {
      background-color: #a1a1aa !important;
      cursor: not-allowed !important;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #000;
      padding: 8px;
    }

    th {
      background: #4f46e5;
      color: white;
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="box">

      <div class="lang-buttons">
        <img src="https://flagcdn.com/fr.svg" title="FR" onclick="setLanguage('fr')">
        <img src="https://flagcdn.com/gb.svg" title="EN" onclick="setLanguage('en')">
      </div>

      <h2>Among Trolls 🃏</h2>
      <div id="app"></div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCOcYbmpg8ULnLZavZFLDlERp3tlKOcdGY",

        votedPlayers = [],
        language = "fr";

    let maxPlayers = 5;

    const translations = {
      fr: {

        numPlayers: "Nombre de joueurs (2 à 10) :",
        roles: "Rôles",

        descriptionText: "Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne.",
        rules: "Règles",

        about: "À propos",

      }
    };

    const translationsRoles = {

    };

    function setLanguage(lang) {
      language = lang;
      render();
    }

    function saveAccount(p) {
      localStorage.setItem("account", JSON.stringify({ pseudo: p }));
    }

    function loadAccount() {
      const d = localStorage.getItem("account");
      if (!d) return null;
      return JSON.parse(d);
    }

    function generateCode() {
      return Math.random().toString(36).substring(2, 7).toUpperCase();
    }

    function assignRoles(list) {
      let a = [];
      for (let r in roleCounts) {
        for (let i = 0; i < roleCounts[r]; i++) a.push(r);
      }
      a.sort(() => Math.random() - 0.5);
      let o = {};
      list.forEach((p, i) => o[p] = a[i]);
      return o;
    }

    function adjustTryHarder() {
      roleCounts["Try-Harder"] = maxPlayers - (roleCounts.Impostor + roleCounts.Scammer);
      if (roleCounts["Try-Harder"] < 0) roleCounts["Try-Harder"] = 0;
    }

    /* TOUT LE RESTE DU SCRIPT EST IDENTIQUE,
       seulement formaté, jusqu’à la fin */

    const account = loadAccount();
    if (account) name = account.pseudo;

    render();
  </script>
