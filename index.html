<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Among Trolls 🃏</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#f3f4f6,#d1d5db,#fbbf24);
  display:flex;justify-content:center;align-items:center;
  height:100vh;margin:0;
}
.box{
  background:white;padding:40px;border-radius:20px;
  width:650px;box-shadow:0 12px 28px rgba(0,0,0,.2);
}
button,input,select{
  width:100%;padding:10px;margin:5px 0;
  border-radius:10px;font-size:16px;
}
button{
  background:#4f46e5;color:white;border:none;cursor:pointer;
}
button:hover{background:#6366f1}
.disabled{background:#aaa;cursor:not-allowed}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #000;padding:6px;text-align:center}
th{background:#4f46e5;color:white}
</style>
</head>

<body>
<div class="box">
<h2>Among Trolls 🃏</h2>
<div id="app"></div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyCOcYbmpg8ULnLZavZFLDlERp3tlKOcdGY",
  databaseURL:"https://amongtroll-4a3c5-default-rtdb.europe-west1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let screen="home",roomCode="",name="",players=[],roles={},owner="";
let votes={},votedPlayers=[],showResults=false; // ⭐

// ---------------- RENDER ----------------
function render(){
const app=document.getElementById("app");
app.innerHTML="";

if(screen==="home"){
app.innerHTML=`
<input id="pseudo" placeholder="Pseudo">
<input id="code" placeholder="Code salon">
<button onclick="createRoom()">Créer salon</button>
<button onclick="joinRoom()">Rejoindre</button>`;
}

if(screen==="lobby"){
app.innerHTML=`
<p>Code: <b>${roomCode}</b></p>
<ul>${players.map(p=>`<li>${p}</li>`).join("")}</ul>
${name===owner?`<button onclick="startGame()">Démarrer</button>`:""}
`;
}

if(screen==="role"){
app.innerHTML=`<p>Ton rôle: <b>${roles[name]}</b></p>`;
players.forEach(p=>{
if(p!==name){
app.innerHTML+=`
<label>${p}
<select id="vote_${p}">
<option value="">--</option>
<option>Imposteur</option>
<option>Escroc</option>
<option>Try-Harder</option>
</select></label>`;
}
});
app.innerHTML+=`
<button onclick="submitVote()">Finis de voter</button>
${name===owner && votedPlayers.length===players.length?
`<button onclick="publishResults()">Résultat</button>`:""}
`;
}

if(screen==="results"){
app.innerHTML="<h3>Résultats</h3><table><tr><th>Joueur</th>";
players.forEach(p=>app.innerHTML+=`<th>${p}<br>${roles[p]}</th>`);
app.innerHTML+="</tr>";

players.forEach(p=>{
app.innerHTML+=`<tr><td>${p}</td>`;
players.forEach(t=>{
if(p===t) app.innerHTML+="<td>--</td>";
else app.innerHTML+=`<td>${votes[p]?.[t]||""}</td>`;
});
app.innerHTML+="</tr>";
});
app.innerHTML+="</table>";
}
}

// ---------------- SALON ----------------
function createRoom(){
name=document.getElementById("pseudo").value;
roomCode=Math.random().toString(36).substr(2,5).toUpperCase();
players=[name]; owner=name;
db.ref("rooms/"+roomCode).set({
players,owner,started:false,
votes:{},votedPlayers:[],showResults:false // ⭐
});
listenRoom(); screen="lobby"; render();
}

function joinRoom(){
name=document.getElementById("pseudo").value;
roomCode=document.getElementById("code").value.toUpperCase();
db.ref("rooms/"+roomCode).get().then(s=>{
if(!s.exists()) return alert("Introuvable");
players=s.val().players;
players.push(name);
db.ref("rooms/"+roomCode+"/players").set(players);
listenRoom(); screen="lobby"; render();
});
}

function listenRoom(){
db.ref("rooms/"+roomCode).on("value",s=>{
if(!s.exists())return;
const d=s.val();
players=d.players; roles=d.roles||{};
votes=d.votes||{}; votedPlayers=d.votedPlayers||[];
showResults=d.showResults||false; // ⭐

if(showResults) screen="results";
else screen=d.started?"role":"lobby";

render();
});
}

// ---------------- GAME ----------------
function startGame(){
roles={};
players.forEach(p=>{
roles[p]=["Imposteur","Escroc","Try-Harder"][Math.floor(Math.random()*3)];
});
db.ref("rooms/"+roomCode).update({started:true,roles});
}

// ---------------- VOTES ----------------
function submitVote(){
let v={};
players.forEach(p=>{
if(p!==name)v[p]=document.getElementById("vote_"+p).value||"";
});
db.ref("rooms/"+roomCode+"/votes/"+name).set(v);
db.ref("rooms/"+roomCode+"/votedPlayers").once("value").then(s=>{
let vp=s.val()||[];
if(!vp.includes(name))vp.push(name);
db.ref("rooms/"+roomCode+"/votedPlayers").set(vp);
});
}

// ⭐ PARTAGE DES RÉSULTATS
function publishResults(){
db.ref("rooms/"+roomCode).update({ showResults:true });
}
render();
</script>
</body>
</html>
