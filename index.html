  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .page { width: 100%; display: flex; justify-content: center; }
    .box { background: white; padding: 20px; border-radius: 12px; width: 360px; z-index: 2; }
    input, button { width: 100%; margin: 6px 0; padding: 6px; }

    hr { margin: 10px 0; }
    .side-ad { width: 160px; position: fixed; top: 50%; transform: translateY(-50%); }
    .left-ad { left: 10px; }

    @media (max-width: 900px) { .side-ad { display: none; } }
    .end-ad { margin-top: 15px; text-align: center; }

    /* === Personnages décoratifs === */
    .characters {
      position: fixed;
      bottom: 15px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 50px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }

    .character {
      width: 40px;
      height: 60px;
      border-radius: 20px;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    .character::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: inherit;
    }

    .imposteur { background: #e74c3c; animation-delay: 0s; }
    .escroc { background: #f1c40f; animation-delay: 0.6s; }
    .tryharder { background: #3498db; animation-delay: 1.2s; }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
  </style>
