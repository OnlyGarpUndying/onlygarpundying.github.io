<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title data-i18n="title">Among Trolls 🃏</title>

  <meta name="description" content="Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne à partir de n'importe quel autre jeu.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Among Trolls">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4250515135506041"
     crossorigin="anonymous"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: linear-gradient(135deg, #f3f4f6, #d1d5db, #fbbf24);
      display: flex; justify-content: center; align-items: center; 
      height: 100vh; margin: 0; transition: background 1s; 
    }
    .page { width: 100%; display: flex; justify-content: center; position: relative; }
    .box { 
      background: white; padding: 60px; border-radius: 20px; width: 600px; 
      z-index: 2; box-shadow: 0 12px 28px rgba(0,0,0,0.2); 
    }
    input, button { 
      width: 100%; margin: 6px 0; padding: 10px; border-radius: 10px; 
      font-size: 16px; box-sizing: border-box; 
    }
    input[type=number] { 
      font-size: 16px; padding: 8px 12px; text-align: center; 
      height: 40px; -moz-appearance: textfield; 
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: inner-spin-button;
      width: 48px; height: 48px;
    }
    button { 
      border: none; cursor: pointer; background-color: #4f46e5; color: white; transition: 0.3s; 
    }
    button:hover { background-color: #6366f1; transform: scale(1.05); }

    .menu { 
      display: flex; 
      justify-content: space-between; 
      gap: 8px; 
      margin-bottom: 10px;
      background: rgba(255,255,255,0.9); 
      padding: 6px; 
      border-radius: 12px; 
    }
    .menu button { width: 100%; font-size: 12px; }

    hr { margin: 10px 0; }
    .side-ad { width: 160px; position: fixed; top: 50%; transform: translateY(-50%); }
    .left-ad { left: 10px; }
    .right-ad { right: 10px; }
    @media (max-width: 900px) { .side-ad { display: none; } }
    .end-ad { margin-top: 15px; text-align: center; }
    .role-popup { animation: pop 0.5s ease-out; }
    @keyframes pop { 0% { transform: scale(0); opacity:0; } 100% { transform: scale(1); opacity:1; } }
    .disabled { background-color: #a1a1aa !important; cursor: not-allowed !important; }

    /* Bouton drapeau */
    #lang-switch {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      z-index: 10;
    }
    #lang-switch img {
      width: 32px;
      height: 32px;
    }
  </style>
</head>

<body>
<div class="page">
  <div id="lang-switch">
    <img src="fr-flag.png" alt="FR" id="current-flag">
  </div>

  <div class="side-ad left-ad">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4250515135506041" data-ad-slot="1111111111" data-ad-format="vertical"></ins>
  </div>

  <div class="box">
    <h2 data-i18n="title">Among Trolls 🃏</h2>
    <div id="app"></div>
  </div>

  <div class="side-ad right-ad">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4250515135506041" data-ad-slot="2222222222" data-ad-format="vertical"></ins>
  </div>
</div>

<script>
(adsbygoogle = window.adsbygoogle || []).push({});
(adsbygoogle = window.adsbygoogle || []).push({});
</script>

<script>
// ------------------- Traductions -------------------
const translations = {
  fr: {
    title: "Among Trolls 🃏",
    localAccount: "Compte local",
    pseudoPlaceholder: "Ton pseudo",
    savePseudo: "Sauvegarder le pseudo",
    createJoinRoom: "Créer ou rejoindre un salon",
    numberPlayers: "Nombre de joueurs (2 à 10) :",
    roles: "Rôles :",
    impostor: "Imposteur",
    scammer: "Escroc",
    tryHarder: "Try-Harder",
    createRoom: "Créer un salon",
    joinRoom: "Rejoindre",
    descriptionTitle: "📝 Description",
    descriptionText: "Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne à partir de n'importe quel autre jeu.",
    home: "Accueil",
    rules: "Règles",
    about: "À propos",
    results: "Résultats finaux",
    newGame: "Nouvelle partie",
    voteFinished: "Finis de voter",
    waitingCreator: "⏳ En attente du créateur de salon",
    waitingPlayersRoles: "⏳ En attente joueurs / rôles",
    rulesText: "Try-Harder : doit gagner la partie.<br>Imposteur : doit perdre la partie sans se faire repérer.<br>Escroc : doit se faire passer pour l'imposteur et gagner.",
    aboutText: "Mini-jeu multijoueur gratuit",
    voteLabel: "Votez pour chaque joueur",
    choose: "--Choisir--",
    notVoted: "Non voté"
  },
  en: {
    title: "Among Trolls 🃏",
    localAccount: "Local Account",
    pseudoPlaceholder: "Your nickname",
    savePseudo: "Save nickname",
    createJoinRoom: "Create or join a room",
    numberPlayers: "Number of players (2-10):",
    roles: "Roles:",
    impostor: "Impostor",
    scammer: "Scammer",
    tryHarder: "Try-Harder",
    createRoom: "Create Room",
    joinRoom: "Join Room",
    descriptionTitle: "📝 Description",
    descriptionText: "Among Trolls is a free online multiplayer hidden role game playable from any device.",
    home: "Home",
    rules: "Rules",
    about: "About",
    results: "Final Results",
    newGame: "New Game",
    voteFinished: "Finish Voting",
    waitingCreator: "⏳ Waiting for room creator",
    waitingPlayersRoles: "⏳ Waiting for players / roles",
    rulesText: "Try-Harder: must win the game.<br>Impostor: must lose without being discovered.<br>Scammer: must pretend to be the impostor and win.",
    aboutText: "Free multiplayer mini-game",
    voteLabel: "Vote for each player",
    choose: "--Choose--",
    notVoted: "Not voted"
  }
};

let currentLang = "fr";

// ------------------- Fonction de traduction -------------------
function updateTexts() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(translations[currentLang][key]) el.textContent = translations[currentLang][key];
  });
  // Mettre à jour placeholder séparément
  const pseudoInput = document.getElementById("pseudo");
  if(pseudoInput) pseudoInput.placeholder = translations[currentLang].pseudoPlaceholder;
}

// ------------------- Changement de langue -------------------
document.getElementById("lang-switch").addEventListener("click", () => {
  currentLang = currentLang === "fr" ? "en" : "fr";
  const flag = document.getElementById("current-flag");
  flag.src = currentLang === "fr" ? "fr-flag.png" : "en-flag.png";
  flag.alt = currentLang.toUpperCase();
  render(); //
});

function render(){
  const app=document.getElementById("app");
  const account = loadAccount();
  const savedPseudo = account ? account.pseudo : "";

  app.innerHTML=`<div class="menu">
      <button onclick="screen='home'; render()" data-i18n="home">Accueil</button>
      <button onclick="screen='rules'; render()" data-i18n="rules">Règles</button>
      <button onclick="screen='about'; render()" data-i18n="about">À propos</button>
      <button onclick="screen='description'; render()" data-i18n="descriptionTitle">Description</button>
    </div><hr>`;
// ------------------- RENDER -------------------
function render(){
  const app=document.getElementById("app");
  const account = loadAccount();
  const savedPseudo = account ? account.pseudo : "";

  app.innerHTML=`
    <div class="menu">
      <button onclick="screen='home'; render()">Accueil</button>
      <button onclick="screen='rules'; render()">Règles</button>
      <button onclick="screen='about'; render()">À propos</button>
      <button onclick="screen='description'; render()">Description</button>
    </div>
    <hr>
  `;

  if(screen==="home"){
    adjustTryHarder();
    app.innerHTML+=`
      <h3>Compte local</h3>
      <input id="pseudo" placeholder="Ton pseudo" value="${savedPseudo}">
      <button onclick="savePseudoFromInput()">Sauvegarder le pseudo</button>
      <hr>
      <h4>Créer ou rejoindre un salon</h4>
      <label>Nombre de joueurs (2 à 10) :</label>
      <input id="maxPlayersInput" type="number" min="2" max="10" value="${maxPlayers}" onchange="maxPlayers=parseInt(this.value); adjustTryHarder(); render()">
      <h4>Rôles :</h4>
      <label>Imposteur : <input id="nbImposteur" type="number" min="0" max="10" value="${roleCounts.Imposteur}" onchange="roleCounts.Imposteur=parseInt(this.value); adjustTryHarder(); render()"></label>
      <label>Escroc : <input id="nbEscroc" type="number" min="0" max="10" value="${roleCounts.Escroc}" onchange="roleCounts.Escroc=parseInt(this.value); adjustTryHarder(); render()"></label>
      <label>Try-Harder : <input type="number" value="${roleCounts['Try-Harder']}" disabled></label>
      <button onclick="createRoom()">Créer un salon</button>
      <input id="code" placeholder="Code du salon">
      <button onclick="joinRoom()">Rejoindre</button>
    `;
  }

  if(screen==="description"){
    app.innerHTML+=`
      <h3>📝 Description</h3>
      <p>
        Among Trolls est un jeu multijoueur de rôle caché jouable gratuitement en ligne
        à partir de n'importe quel autre jeu.
      </p>
    `;
  }

  if(screen==="lobby"){
    app.innerHTML+=`<p>Code : <b>${roomCode}</b></p><ul>${players.map(p=>`<li>${p}</li>`).join("")}</ul><p>(${players.length}/${maxPlayers})</p>`;
    if(name===owner){
      const totalRoles=roleCounts.Imposteur+roleCounts.Escroc+roleCounts["Try-Harder"];
      if(players.length===maxPlayers && totalRoles===maxPlayers){
        app.innerHTML+=`<button onclick="startGame()">Démarrer la partie</button>`;
      }else{
        app.innerHTML+=`<p>⏳ En attente joueurs / rôles</p>`;
      }
    }else{
      app.innerHTML+=`<p>⏳ En attente du créateur de salon</p>`;
    }
  }

  if(screen==="role"){
    app.innerHTML+=`<p class="role-popup">Ton rôle : <b>${roles[name]}</b></p>`;
    app.innerHTML+="<h3>Votez pour chaque joueur</h3>";
    players.forEach(p=>{
      if(p!==name){
        const v=votes[name] && votes[name][p] ? votes[name][p] : "";
        app.innerHTML+=`
          <label>${p} :
            <select id="vote_${p}">
              <option value="">--Choisir--</option>
              <option value="Imposteur" ${v==="Imposteur"?"selected":""}>Imposteur</option>
              <option value="Escroc" ${v==="Escroc"?"selected":""}>Escroc</option>
              <option value="Try-Harder" ${v==="Try-Harder"?"selected":""}>Try-Harder</option>
            </select>
          </label>
        `;
      }
    });
    app.innerHTML+=`<button ${votedPlayers.includes(name)?"disabled class='disabled'":""} onclick="submitVote()">Finis de voter</button>`;
    if(votedPlayers.length===players.length && name===owner){
      app.innerHTML+=`<button onclick="showResults()">Résultat</button>`;
    }
  }

  if(screen==="results"){
    app.innerHTML+="<h3>Résultats finaux</h3>";
    app.innerHTML+=`
      <table style="
        width:100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        text-align:center;
        margin-top:10px;
      ">
        <thead>
          <tr style="background:#4f46e5; color:white;">
            <th style="border:1px solid #000; padding:8px;">Joueur</th>
            ${players.map(p=>`<th style="border:1px solid #000; padding:8px;">${p}<br>(${roles[p]})</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${players.map((p,i)=>`
            <tr style="background:${i%2===0?'#f9f9f9':'#ffffff'};">
              <td style="border:1px solid #000; padding:8px;">${p}</td>
              ${players.map(target=>{
                if(p===target){
                  return `<td style="border:1px solid #000; padding:8px;">--</td>`;
                } else {
                  const voteValue = votes[p] && votes[p][target] ? votes[p][target] : "";
                  return `<td style="border:1px solid #000; padding:8px;">${voteValue}</td>`;
                }
              }).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    if(name===owner){
      app.innerHTML+=`<button style="margin-top:10px;" onclick="restartGame()">Nouvelle partie</button>`;
    }
  }

  if(screen==="rules"){app.innerHTML+=`<h3>📜 Règles</h3><p>Try-Harder : doit gagner la partie.<br>Imposteur : doit perdre la partie sans se faire repérer.<br>Escroc : doit se faire passer pour l'imposteur et gagner.</p>`;}
  if(screen==="about"){app.innerHTML+=`<h3>ℹ️ À propos</h3><p>Mini-jeu multijoueur gratuit</p>`;}
}

// ------------------- Compte -------------------
function savePseudoFromInput(){
  const pseudo=document.getElementById("pseudo").value.trim();
  if(!pseudo) return alert("Pseudo requis");
  saveAccount(pseudo);
  name=pseudo;
  render();
}

// ------------------- SALON -------------------
function createRoom(){
  name=document.getElementById("pseudo").value.trim(); 
  if(!name) return alert("Pseudo requis");
  maxPlayers=parseInt(document.getElementById("maxPlayersInput").value); adjustTryHarder();
  if(maxPlayers<2||maxPlayers>10) return alert("Nombre de joueurs entre 2 et 10");
  if(roleCounts.Imposteur+roleCounts.Escroc+roleCounts["Try-Harder"]!==maxPlayers) return alert("Le total des rôles doit égaler le nombre de joueurs");
  roomCode=generateCode(); players=[name]; owner=name;
  db.ref("rooms/"+roomCode).set({players,owner,started:false,maxPlayers,roleCounts,votes:{},votedPlayers:[]});
  listenRoom(); screen="lobby"; render();
}

function joinRoom(){
  name=document.getElementById("pseudo").value.trim(); 
  roomCode=document.getElementById("code").value.trim().toUpperCase();
  if(!name) return alert("Pseudo requis");
  db.ref("rooms/"+roomCode).get().then(snap=>{
    if(!snap.exists()) return alert("Salon introuvable");
    const data=snap.val(); 
    players=data.players||[]; owner=data.owner||""; 
    maxPlayers=data.maxPlayers||maxPlayers; 
    roleCounts=data.roleCounts||roleCounts;
    votes=data.votes||{};
    votedPlayers=data.votedPlayers||[];
    if(players.length>=maxPlayers) return alert("Salon complet");
    if(!players.includes(name)) players.push(name); 
    db.ref("rooms/"+roomCode+"/players").set(players);
    listenRoom(); screen="lobby"; render();
  });
}

function listenRoom(){
  db.ref("rooms/"+roomCode).on("value",snap=>{
    if(!snap.exists()) return; 
    const data=snap.val();
    players=data.players||[]; 
    roles=data.roles||{}; 
    owner=data.owner||""; 
    maxPlayers=data.maxPlayers||maxPlayers; 
    roleCounts=data.roleCounts||roleCounts;
    votes=data.votes||{};
    votedPlayers=data.votedPlayers||[];
    screen=data.started?"role":"lobby"; 
    render();
  });
}

// ------------------- GAME -------------------
function startGame(){if(name!==owner) return; roles=assignRoles(players); db.ref("rooms/"+roomCode).update({roles,started:true,votes:{},votedPlayers:[]});}
function restartGame(){if(name!==owner) return; roles=assignRoles(players); db.ref("rooms/"+roomCode).update({started:true,roles,votes:{},votedPlayers:[]}); screen="role"; render();}

// ------------------- VOTE -------------------
function submitVote(){
  const v={};
  players.forEach(p=>{
    if(p!==name){
      const val=document.getElementById("vote_"+p).value;
      v[p]=val || "Non voté";
    }
  });

  // Mise à jour du vote du joueur courant uniquement
  db.ref("rooms/"+roomCode+"/votes/"+name).set(v);

  // Mise à jour de la liste des joueurs ayant voté
  db.ref("rooms/"+roomCode+"/votedPlayers").once("value").then(snap=>{
    let vp = snap.val() || [];
    if(!vp.includes(name)) vp.push(name);
    db.ref("rooms/"+roomCode+"/votedPlayers").set(vp);
  });

  render();
}

function showResults(){
  screen="results";
  render();
}

// Auto-load pseudo si compte existe
const account = loadAccount();
if(account) name = account.pseudo;

render();
</script>

</body>
</html>
